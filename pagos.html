<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<title>Registrar Miembro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/pagos.css">
<link rel="stylesheet" href="css/menu.css">


</head>

<body>

    <div class="d-flex"> <!-- Contenedor flex para sidebar + contenido -->

        <!-- Menú lateral -->
        <div id="sidebar-container"></div>
        <!-- Fin sidebar -->

<div class="content">

    <h2 class="mb-4">Pagos</h2>

    <!-- BUSCADOR -->
    <div class="search-box mb-4">
        <input type="text" id="buscarMiembro" class="form-control" placeholder="Buscar miembro por nombre...">
    </div>

    <!-- TARJETA USUARIO -->
    <div id="cardUsuario" class="user-card mb-4 d-none">

        <h4 id="nombreCompleto">Juan Pérez</h4>
        <p>ID: <span id="idUsuario">0001</span></p>

    </div>

    <!-- PANEL DE PAGO -->
   <div id="panelPago" class="pago-card">

    <h5 class="mb-3">Seleccionar tipo de pago</h5>

    <div class="row g-3 mb-4">

        <div class="col-md-3">
            <button class="btn-pago" data-tipo="visita">Visita</button>
        </div>

        <div class="col-md-3">
            <button class="btn-pago" data-tipo="semana">Semana</button>
        </div>

        <div class="col-md-3">
            <button class="btn-pago" data-tipo="quincena">Quincena</button>
        </div>

        <div class="col-md-3">
            <button class="btn-pago" data-tipo="mensualidad">Mensualidad</button>
        </div>

    </div>

    <!-- BOTÓN CONFIRMAR -->
    <button id="btnConfirmar" class="btn-confirmar" disabled>
        Confirmar pago
    </button>

</div>

</div>

<script src="js/sidebar.js"></script>
<script src="js/pagos.js"></script>
</body>
</html>

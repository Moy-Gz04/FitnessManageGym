<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Pagos
    </title>

    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- ESTILO GLOBAL -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- ESTILOS -->
    <link
        rel="stylesheet"
        href="css/menu.css"
    >

    <link
        rel="stylesheet"
        href="css/pagos.css"
    >

    <link
        rel="stylesheet"
        href="css/modales.css"
    >

    <!-- TEMA -->
    <script
        src="js/theme-loader.js"
        defer
    ></script>

</head>

<body>

    <div class="d-flex">

        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- CONTENIDO -->
        <div class="content">

            <div class="pagos-wrapper">

                <!-- TITULO -->
                <h2>
                    Pagos
                </h2>

                <!-- ============================= -->
                <!-- BUSCADOR -->
                <!-- ============================= -->

                <div class="search-container">

                    <span class="icono">
                        🔍
                    </span>

                    <input
                        type="text"
                        id="buscarMiembro"
                        class="form-control"
                        placeholder="Buscar miembro por nombre o apellido..."
                        autocomplete="off"
                    >

                </div>

                <!-- ============================= -->
                <!-- RESULTADOS -->
                <!-- ============================= -->

                <div
                    id="listaMiembros"
                    class="resultados-card"
                >
                    <!-- dinámico -->
                </div>

                <!-- ============================= -->
                <!-- TARJETA MIEMBRO -->
                <!-- ============================= -->

                <div
                    id="cardUsuario"
                    class="user-card d-none"
                >

                    <h4 id="nombreCompleto">
                        Nombre del miembro
                    </h4>

                    <p>
                        ID:
                        <span id="idUsuario">
                            0
                        </span>
                    </p>

                </div>

                <!-- ============================= -->
                <!-- TIPOS DE PAGO -->
                <!-- ============================= -->

                <div class="pagos-grid">

                    <button
                        class="btn-pago"
                        data-tipo="visita"
                    >
                        VISITA
                    </button>

                    <button
                        class="btn-pago"
                        data-tipo="semana"
                    >
                        SEMANA
                    </button>

                    <button
                        class="btn-pago"
                        data-tipo="quincena"
                    >
                        QUINCENA
                    </button>

                    <button
                        class="btn-pago"
                        data-tipo="mensualidad"
                    >
                        MENSUALIDAD
                    </button>

                </div>

                <!-- ============================= -->
                <!-- CONFIRMAR -->
                <!-- ============================= -->

                <div class="confirmar-wrapper">

                    <button
                        id="btnConfirmar"
                        class="btn-confirmar"
                        disabled
                    >
                        CONFIRMAR PAGO
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- ============================= -->
    <!-- MODAL PAGO -->
    <!-- ============================= -->

    <div
        class="modal fade"
        id="modalPago"
        tabindex="-1"
    >

        <div
            class="modal-dialog modal-dialog-centered modal-confirm-pro"
        >

            <div
                class="modal-content modal-dark"
            >

                <!-- BODY -->
                <div class="modal-body">

                    <!-- ICONO -->
                    <div class="check-container mb-3">

                        <div
                            class="check-circle"
                            id="iconoPago"
                        >
                            ✓
                        </div>

                    </div>

                    <!-- TITULO -->
                    <h4
                        id="tituloPago"
                        class="titulo-exito"
                    >
                        Pago registrado
                    </h4>

                    <!-- MENSAJE -->
                    <div
                        id="mensajePago"
                        class="texto-confirm mt-3"
                    >
                        Pago realizado correctamente
                    </div>

                </div>

                <!-- FOOTER -->
                <div
                    class="modal-footer justify-content-center"
                >

                    <button
                        class="btn btn-success btn-ok"
                        data-bs-dismiss="modal"
                    >
                        Aceptar
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- DECORACIÓN -->
    <div class="bg-glow"></div>

    <!-- BOOTSTRAP -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- SIDEBAR -->
    <script
        src="js/sidebar.js"
        defer
    ></script>

    <!-- PAGOS -->
    <script
        src="js/pagos.js"
        defer
    ></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Miembros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/menu.css">

</head>

<body>

    <div class="d-flex">

        <!-- Menú lateral -->
        <div id="sidebar-container"></div>
        <!-- Fin sidebar -->

        <!-- CONTENT -->
        <div class="content p-4">

            <h2 class="mb-4">Miembros</h2>

            <!-- BUSCADOR -->
            <div class="search-container mb-4">

                <input type="text" id="buscadorMiembros" class="form-control search-input"
                    placeholder="🔎 Buscar por nombre, email o teléfono...">

            </div>

            <!-- TABLA -->
            <div class="table-container">

                <table class="table table-hover align-middle">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th>Huella</th>
                            <th>Registro</th>
                            <th>Vencimiento</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaMiembros"></tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- MODAL EDITAR -->
    <div class="modal fade" id="modalEditar" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content modal-dark">

                <div class="modal-header">
                    <h5 class="modal-title">Editar miembro</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <input type="hidden" id="editId">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label>Nombre</label>
                            <input type="text" class="form-control" id="editNombre">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Apellido</label>
                            <input type="text" class="form-control" id="editApellido">
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label>Email</label>
                            <input type="email" class="form-control" id="editEmail">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Teléfono</label>
                            <input type="text" class="form-control" id="editTelefono">
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label>ID Huella</label>
                            <input type="text" class="form-control" id="editHuella">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Fecha vencimiento</label>
                            <input type="date" class="form-control" id="editVencimiento">
                        </div>

                    </div>

                    <div class="form-check">

                        <input type="checkbox" id="editActivo" class="form-check-input">
                        <label class="form-check-label">Membresía activa</label>

                    </div>

                </div>

                <div class="modal-footer">

                    <button class="btn btn-success" onclick="guardarCambios()">Guardar cambios</button>

                </div>

            </div>

        </div>

    </div>


    <!-- MODAL PAGO -->

    <div class="modal fade" id="modalPago" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content modal-dark">

                <div class="modal-header">
                    <h5 class="modal-title">Registrar pago</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <input type="hidden" id="pagoMiembroId">

                    <div class="mb-3">
                        <label>Miembro</label>
                        <input type="text" id="pagoNombre" class="form-control" disabled>
                    </div>

                    <div class="mb-3">
                        <label>Monto</label>
                        <input type="number" id="pagoMonto" class="form-control" value="500">
                    </div>

                    <div class="mb-3">
                        <label>Meses pagados</label>
                        <input type="number" id="pagoMeses" class="form-control" value="1">
                    </div>

                    <div class="mb-3">
                        <label>Observaciones</label>
                        <input type="text" id="pagoObs" class="form-control" value="Pago mensual">
                    </div>

                </div>

                <div class="modal-footer">

                    <button class="btn btn-success" onclick="registrarPago()">
                        Registrar pago
                    </button>

                </div>

            </div>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/api.js"></script>
    <script src="js/miembros.js"></script>

    <script src="js/sidebar.js"></script>

</body>

</html>

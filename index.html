
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- LOGO -->
            <div class="login-logo">

    <img
        src="../img/logo.png"
        alt="Logo"
    >

</div>

            <!-- TITULO -->
            <h1 class="login-title">
                Gym System
            </h1>

            <p class="login-subtitle">
                Acceso al sistema
            </p>

            <!-- USUARIO -->
            <div class="mb-3">

                <input
                    type="text"
                    id="usuario"
                    class="form-control"
                    placeholder="Usuario"
                >

            </div>

            <!-- PASSWORD -->
            <div class="mb-3">

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Contraseña"
                >

            </div>

            <!-- BOTON -->
            <button
                class="btn-login"
                onclick="login()"
            >
                Ingresar
            </button>

            <!-- MENSAJE -->
            <div
                id="mensaje"
                class="mensaje-login"
            ></div>

        </div>

    </div>

    <!-- JS -->
    <script src="js/login.js"></script>

</body>

</html>

<!DOCTYPE html> <!-- Define que el documento es HTML5 -->

<html lang="es"> <!-- Inicio del documento y lenguaje en español -->

<head> <!-- Cabecera del documento -->

    <meta charset="UTF-8"> <!-- Permite usar acentos, ñ, etc -->

    <title>Sistema Gym</title> <!-- Título de la pestaña -->

    <!-- Bootstrap para estilos rápidos sin sufrir -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tus estilos personalizados -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/menu.css">

</head>

<body> <!-- Todo lo visible -->

    <div class="d-flex"> <!-- Contenedor flex para sidebar + contenido -->

        <!-- Menú lateral -->
        <div id="sidebar-container"></div>
        <!-- Fin sidebar -->

        <div class="content"> <!-- Contenido principal -->

            <h2 class="mb-4">Dashboard</h2> <!-- Título con margen -->

            <div class="row g-4"> <!-- Fila con separación -->

                <!-- Tarjeta: Miembros activos -->
                <div class="col-md-3">
                    <div class="card stat">
                        <h5>Miembros Activos</h5>
                        <p id="activos">0</p> <!-- Se llenará con JS -->
                    </div>
                </div>

                <!-- Tarjeta: Miembros vencidos -->
                <div class="col-md-3">
                    <div class="card stat">
                        <h5>Miembros Vencidos</h5>
                        <p id="vencidos">0</p>
                    </div>
                </div>

                <!-- Tarjeta: Ingresos -->
                <div class="col-md-3">
                    <div class="card stat">
                        <h5>Ingresos del Mes</h5>
                        <p id="ingresosMes">$0</p>
                    </div>
                </div>

                <!-- Tarjeta: Total miembros -->
                <div class="col-md-3">
                    <div class="card stat">
                        <h5>Total Miembros</h5>
                        <p id="miembrosTotal">0</p>
                    </div>
                </div>

            </div> <!-- Fin fila stats -->

            <div class="row mt-5 g-4"> <!-- Nueva fila con margen superior -->

                <!-- Gráfica -->
                <div class="col-md-8">

                    <div class="card p-4">

                        <h4 class="mb-3">Ingresos del Mes</h4>

                        <!-- Canvas donde se dibuja la gráfica -->
                        <canvas id="grafica"></canvas>

                    </div>

                </div>

                <!-- Últimos accesos -->
                <div class="col-md-4">

                    <div class="card p-4">

                        <h4 class="mb-3">Últimos accesos</h4>

                        <ul class="list-unstyled"> <!-- Lista sin estilos -->

                            <li>Juan Lopez - 07:30</li> <!-- Datos estáticos -->
                            <li>Carlos Ramirez - 08:10</li>
                            <li>Maria Hernandez - 09:00</li>

                        </ul>

                    </div>

                </div>

            </div> <!-- Fin fila -->

        </div> <!-- Fin contenido -->

    </div> <!-- Fin contenedor principal -->

    <!-- Librería para gráficas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>

        // Obtiene el canvas donde se dibujará la gráfica
        const ctx = document.getElementById('grafica');

        // Crea la gráfica
        new Chart(ctx, {
            type: 'line', // Tipo línea

            data: {
                labels: ['Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab', 'Dom'], // Eje X

                datasets: [{
                    label: 'Ingresos', // Nombre del dataset

                    data: [2000, 3000, 2500, 4000, 3500, 5000, 4500], // Datos (hardcodeados)

                    borderColor: '#38bdf8', // Color línea
                    backgroundColor: 'rgba(56,189,248,0.15)', // Fondo
                    pointBackgroundColor: '#38bdf8', // Color puntos
                    pointRadius: 5, // Tamaño puntos
                    borderWidth: 3, // Grosor línea
                    tension: 0.4 // Curvatura
                }]
            },

            options: {

                plugins: {
                    legend: {
                        labels: {
                            color: '#e2e8f0' // Color texto leyenda
                        }
                    }
                },

                scales: {

                    x: {
                        ticks: {
                            color: '#cbd5e1' // Color etiquetas X
                        },
                        grid: {
                            color: 'rgba(255,255,255,0.05)' // Líneas de fondo
                        }
                    },

                    y: {
                        ticks: {
                            color: '#cbd5e1' // Color etiquetas Y
                        },
                        grid: {
                            color: 'rgba(255,255,255,0.05)'
                        }
                    } 

                }

            }

        });

    </script>

    <!-- Archivo para conexión con API -->
    <script src="js/api.js"></script>

    <!-- Lógica del dashboard (llenar datos dinámicos) -->
    <script src="js/dashboard.js"></script>

    <!-- Efecto visual decorativo -->
    <div class="bg-glow"></div>

    <script src="js/sidebar.js"></script>

</body>
</html>

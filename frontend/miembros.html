<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Miembros</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- TU CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/miembros.css">
</head>

<body>

<div class="d-flex">

    <!-- 🔥 SIDEBAR -->
    <div id="sidebar-container"></div>

    <!-- CONTENIDO -->
    <div class="content p-4 w-100">

        <h2 class="mb-4">Miembros</h2>

        <!-- BUSCADOR -->
        <input 
            type="text" 
            id="buscadorMiembros" 
            class="form-control mb-3" 
            placeholder="🔎 Buscar..."
        >

        <!-- TABLA -->
        <table class="tabla-miembros">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Huella</th>
                    <th>Registro</th>
                    <th>Vencimiento</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaMiembros"></tbody>

        </table>

    </div>

</div>

<!-- MODAL EDITAR -->
<div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Editar miembro</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <input type="hidden" id="editId">

                <input type="text" id="editNombre" class="form-control mb-2" placeholder="Nombre">
                <input type="text" id="editApellido" class="form-control mb-2" placeholder="Apellido">
                <input type="email" id="editEmail" class="form-control mb-2" placeholder="Email">
                <input type="text" id="editTelefono" class="form-control mb-2" placeholder="Teléfono">
                <input type="text" id="editHuella" class="form-control mb-2" placeholder="Huella ID">
                <input type="date" id="editVencimiento" class="form-control mb-2">

            </div>

            <div class="modal-footer">
                <button class="btn btn-success" onclick="guardarCambios()">Guardar</button>
            </div>

        </div>
    </div>
</div>

<!-- MODAL PAGO -->
<div class="modal fade" id="modalPago" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Registrar pago</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <input type="hidden" id="pagoMiembroId">

                <input type="text" id="pagoNombre" class="form-control mb-2" disabled>
                <input type="number" id="pagoMonto" class="form-control mb-2" value="500">
                <input type="number" id="pagoMeses" class="form-control mb-2" value="1">
                <input type="text" id="pagoObs" class="form-control mb-2" value="Pago mensual">

            </div>

            <div class="modal-footer">
                <button class="btn btn-success" onclick="registrarPago()">Registrar pago</button>
            </div>

        </div>
    </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- 🔥 MENU DINÁMICO -->
<script src="../js/sidebar.js"></script>

<!-- 🔥 LÓGICA -->
<script src="../js/miembros.js"></script>

</body>
</html>

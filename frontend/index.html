<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Sistema Gym</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

    <div class="d-flex">

        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <div class="content">

            <h2 class="mb-4">Dashboard</h2>

            <!-- 🔥 MÉTRICAS PRINCIPALES -->
            <div class="row g-4">

                <div class="col-md-3">
                    <div class="card stat">
                        <h5>Miembros Activos</h5>
                        <p id="activos">0</p>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card stat">
                        <h5>Miembros Vencidos</h5>
                        <p id="vencidos">0</p>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card stat">
                        <h5>Ingresos del Mes</h5>
                        <p id="ingresosMes">$0</p>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card stat">
                        <h5>Total Miembros</h5>
                        <p id="miembrosTotal">0</p>
                    </div>
                </div>

            </div>

            <!-- 🧠 MÉTRICAS AVANZADAS -->
            <div class="row g-4 mt-2">

                <div class="col-md-3">
                    <div class="card stat">
                        <h5>Nuevos este mes</h5>
                        <p id="nuevosMes">0</p>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card stat">
                        <h5>Por vencer (3 días)</h5>
                        <p id="porVencer">0</p>
                    </div>
                </div>

            </div>

            <!-- 📊 CONTENIDO -->
            <div class="row mt-5 g-4">

                <!-- Gráfica -->
                <div class="col-md-8">
                    <div class="card p-4">
                        <h4 class="mb-3">Comparación Ingresos (Anual)</h4>
                        <canvas id="grafica"></canvas>
                    </div>
                </div>

                <!-- Últimos accesos -->
                <div class="col-md-4">
                    <div class="card p-4">
                        <h4 class="mb-3">Últimos accesos</h4>

                        <ul id="listaAccesos" class="list-unstyled">
                            <!-- dinámico -->
                        </ul>

                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Dashboard -->
    <script src="../js/dashboard.js"></script>

    <!-- Sidebar -->
    <script src="../js/sidebar.js"></script>

    <div class="bg-glow"></div>

</body>
</html>

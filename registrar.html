<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<title>Registrar Miembro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/registro-u.css">
<link rel="stylesheet" href="css/menu.css">

</head>

<body>

<div class="d-flex">

<!-- Menú lateral -->
<div id="sidebar-container"></div>
<!-- Fin sidebar -->

<!-- CONTENIDO -->
<div class="content p-4">

<h2 class="mb-4">Registrar nuevo miembro</h2>

<div class="form-container">

<form id="formMiembro">

<div class="row">

<div class="col-md-4 mb-4">
<label>Nombre(s)</label>
<input type="text" class="form-control" id="nombres" name="nombres" required>
</div>

<div class="col-md-4 mb-4">
<label>Apellido Paterno</label>
<input type="text" class="form-control" id="apellidoPaterno" name="apellidoPaterno" required>
</div>

<div class="col-md-4 mb-4">
<label>Apellido Materno</label>
<input type="text" class="form-control" id="apellidoMaterno" name="apellidoMaterno" required>
</div>

</div>

<div class="row">

<div class="col-md-6 mb-4">
<label>Teléfono (opcional)</label>
<input type="text" class="form-control" id="telefono" name="telefono">
</div>

<div class="col-md-6 mb-4">
<label>Correo (opcional)</label>
<input type="email" class="form-control" id="correo" name="correo">
</div>

</div>

<div class="row">

<div class="col-md-6 mb-4">
<label>Fecha de nacimiento</label>
<input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento" required>
</div>

<div class="col-md-6 mb-4">
<label>Huella biométrica</label>

<div class="d-flex align-items-center gap-3 mt-2">

<button type="button" id="btnHuella" class="btn btn-primary">
Capturar Huella
</button>

<span id="estadoHuella" class="text-muted">
No registrada
</span>

</div>

</div>

</div>

<button type="submit" class="btn btn-success btn-lg">
Registrar miembro
</button>

</form>

</div>
</div>
</div>

<!-- SCRIPTS -->
<script src="js/api.js" defer></script>
<script src="js/registrar.js" defer></script>
<script src="js/sidebar.js" defer></script>

</body>
</html>
